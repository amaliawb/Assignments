<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FACS vs scRNA-seq{% endblock %}</title>
  <!-- Fonts: Fraunces (headings) and Nunito (text), from Google Fonts.
       Without internet the page falls back to the system fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">FACS vs scRNA-seq</a>
    <span class="tagline">Urine cell populations: BD S8 sorting vs 10x Flex</span>
  </header>
  <main>
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<pre class="alert">{{ message }}</pre>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
